name: Feature request
description: Suggest an improvement or new Kairo Shell feature
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement to Kairo Shell.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem or workflow would this feature improve?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe how you would like Kairo Shell to handle it.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Are there other approaches you considered?

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add mockups, screenshots, examples, or other useful information.

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for similar requests.
          required: true
        - label: This request is relevant to Kairo Shell.
          required: true
